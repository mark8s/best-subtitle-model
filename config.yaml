# =============================================================================
# 字幕翻译测试配置
# -----------------------------------------------------------------------------
# 切换模型：改 active_model，或命令行：
#   python translate_srt.py --model-id nllb-600m-int8
#   python translate_srt.py --model-id m2m100-418m-int8
# =============================================================================

# 当前默认使用的模型 id（必须在 models 里存在）
active_model: nllb-600m-int8

# 全局默认（可被「模型自己的配置」以及「命令行参数」覆盖）
# 优先级：命令行 > 模型配置 > 这里的 defaults
defaults:
  input: input
  output: output
  device: auto          # auto | cpu | cuda
  compute_type: auto    # auto | int8 | float32 ...
  beam_size: 2
  batch_size: 32
  suffix: ""

# -----------------------------------------------------------------------------
# 已注册模型列表
# path 相对本配置文件所在目录（项目根目录）
# type:
#   - ctranslate2-nllb   : NLLB（语言码如 jpn_Jpan / zho_Hans）
#   - ctranslate2-m2m100 : M2M100（语言码如 ja / zh / en）
# -----------------------------------------------------------------------------
models:
  nllb-600m-int8:
    name: NLLB-200 Distilled 600M (CTranslate2 INT8)
    type: ctranslate2-nllb
    path: models/nllb-600m-int8
    src: eng_Latn
    tgt: zho_Hans

  m2m100-418m-int8:
    name: M2M100 418M (CTranslate2 INT8)
    type: ctranslate2-m2m100
    path: models/m2m100-418m-int8
    src: ja                 # M2M100 用短码：ja/zh/en ...
    tgt: zh
